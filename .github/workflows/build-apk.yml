name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy web files into www
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.webmanifest sw.js www/
          cp icon*.png icon.svg www/ 2>/dev/null || true
          for d in assets icons; do
            if [ -d "$d" ]; then cp -r "$d" "www/$d"; fi
          done
          ls -la www

      - name: Install Capacitor
        run: npm install

      - name: Add Android project
        run: npx cap add android

      - name: Sync web files into Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AwaHome-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
